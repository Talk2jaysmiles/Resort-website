<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/contact.css" />
    <title>Contact</title>
  </head>

  <body>
    <main class="contact-container">
      <h2>CONTACT US</h2>
      <div class="horiz">
        <hr />
        <hr class="green-horiz" />
        <hr />
      </div>
      <p>
        Lorem, ipsum dolor sit amet consectetur adipisicing elit. Quos
        laboriosam minus et!elit. Quos laboriosam minus et!
      </p>
      <div class="info">
        <div class="info-details">
          <i
            class="fa-sharp fa-solid fa-location-dot fa-2xl"
            style="color: rgb(99, 230, 190)"
          ></i>
          <p><strong>ADDRESS</strong></p>
          <p>
            A10B Adam Street, NY <br />
            535022, USA
          </p>
        </div>
        <div class="info-details border">
          <i
            class="fa-sharp fa-solid fa-phone fa-2xl"
            style="color: rgb(99, 230, 190)"
          ></i>
          <p><strong>PHONE NUMBER</strong></p>
          <p>+1 5589 55488 55</p>
        </div>
        <div class="info-details">
          <i
            class="fa-sharp fa-solid fa-envelope fa-2xl"
            style="color: rgb(99, 230, 190)"
          ></i>
          <p><strong>EMAIL</strong></p>
          <p>@info@example.com</p>
        </div>
      </div>
      <form>
        <div class="form2">
          <input type="text" placeholder="Your Name" />
          <input type="email" placeholder="Your Email" />
        </div>
        <input type="text" placeholder="Subject" />
        <textarea placeholder="Message"></textarea>
         <button>Send Message</button>
      </form>
    </main>
  </body>
</html>
