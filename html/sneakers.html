<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="/css/sneaker.css">
    <title>SNEAKERS</title>
</head>

<body>
    <header>
        <nav>
            <h2>sneakers</h2>
            <ul>
                <li><a href="#">Collection</a></li>
                <li><a href="#">Men</a></li>
                <li><a href="#">Women</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <div class="nav-icon">
            <i class="fa-solid fa-cart-shopping fa-lg" style="color: #000;"></i>
            <img src="/images/avatar.jpg.jpeg" alt="">
        </div>
    </header>
    <main>
        <aside class="image-container">
            <div class="big-image">
                <img src="/images/sneaker1.jpeg" alt="">
            </div>
            <div class="small-images">
                <img class="o" src="/images/sneaker1.jpeg" alt="">
                <img src="/images/sneaker3.jpeg" alt="">
                <img src="/images/sneaker4.jpeg" alt="">
                <img src="/images/sneaker5.jpeg" alt="">
            </div>
        </aside>
        <aside class="content">
            <h5>SNEAKER COMPANY</h5>
            <h2>Fall Limited Edition Sneakers</h2>
            <p>These low-profile sneakers are your perfect casual wear companion, Featuring a durable rubber outer sole,
                they'll withstand everything the weather can offer.</p>
            <div class="prices">
                <p>$125.00</p>
                <span>50%</span>
            </div>
            <p><del>$250.00</del></p>
            <div class="btn">
                <button class="white-btn">
                    <i class="fa-solid fa-minus fa-lg" style="color: rgb(255, 212, 59);"></i>
                    0
                    <i class="fa-solid fa-plus fa-lg" style="color: rgb(255, 212, 59);"></i>
                </button>
                <button class="orange-btn">
                    <i class="fa-solid fa-cart-shopping fa-lg" style="color: #000;"></i>
                    Add to cart
                </button>
            </div>
        </aside>
    </main>
</body>

</html>
